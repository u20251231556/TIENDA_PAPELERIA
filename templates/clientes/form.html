{% extends "base.html" %}

{% block title %}{{ titulo }} | Papelería{% endblock %}

{% block content %}
<h1>{{ titulo }}</h1>

{% for error in errores %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endfor %}

<form method="post">
    <div class="mb-3">
        <label for="nombre_cliente" class="form-label">
            Nombre del cliente
        </label>
        <input
            type="text"
            class="form-control"
            id="nombre_cliente"
            name="nombre_cliente"
            value="{{ item.nombre_cliente }}"
            maxlength="100"
            required>
    </div>

    <div class="mb-3">
        <label for="identificacion" class="form-label">
            Identificación
        </label>
        <input
            type="text"
            class="form-control"
            id="identificacion"
            name="identificacion"
            value="{{ item.identificacion or '' }}"
            maxlength="30"
            required>
    </div>

    <div class="mb-3">
        <label for="telefono" class="form-label">
            Teléfono (opcional)
        </label>
        <input
            type="tel"
            class="form-control"
            id="telefono"
            name="telefono"
            value="{{ item.telefono or '' }}"
            pattern="\+?[0-9]{7,15}"
            maxlength="16"
            aria-describedby="ayuda_telefono">

        <div id="ayuda_telefono" class="form-text">
            De 7 a 15 dígitos, sin espacios ni guiones.
            Puede comenzar con +.
        </div>
    </div>

    <div class="mb-3">
        <label for="correo_electronico" class="form-label">
            Correo electrónico (opcional)
        </label>
        <input
            type="email"
            class="form-control"
            id="correo_electronico"
            name="correo_electronico"
            value="{{ item.correo_electronico or '' }}"
            maxlength="100">
    </div>

    <button type="submit" class="btn btn-primary">
        Guardar
    </button>

    <a href="{{ url_for('clientes.listar') }}"
        class="btn btn-secondary">
        Cancelar
    </a>
</form>
{% endblock %}
