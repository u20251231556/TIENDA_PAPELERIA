
{% extends "base.html" %}


{% block title %}
    {{ titulo|default('Nueva marca') }} | Papelería
{% endblock %}


{% block content %}
<h1>{{ titulo|default('Nueva marca') }}</h1>


{% for error in errores %}
<div class="alert alert-danger" role="alert">
    {{ error }}
</div>
{% endfor %}


<form method="post">
    <div class="mb-3">
        <label for="nombre_marca" class="form-label">
            Nombre de la marca
        </label>


        <input
            type="text"
            class="form-control"
            id="nombre_marca"
            name="nombre_marca"
            value="{{ nombre }}"
            maxlength="80"
            required>
    </div>


    <button type="submit" class="btn btn-primary">
        Guardar
    </button>


    <a href="{{ url_for('marcas.listar') }}"
        class="btn btn-secondary">
        Cancelar
    </a>
</form>
{% endblock %}
