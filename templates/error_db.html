<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error de conexión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5" style="max-width: 760px">
  <div class="alert alert-danger">
    <h1 class="h4">No se pudo conectar a PostgreSQL</h1>
    <p class="mb-2">Revisa que el servidor esté encendido y que los datos del archivo
      <code>.env</code> (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD) sean correctos.</p>
    <pre class="small mb-0 text-wrap">{{ error }}</pre>
  </div>
</main>
</body>
</html>
