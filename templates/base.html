<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Papelería{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<script>
    setTimeout(() => {
        document.querySelectorAll(".alert-success").forEach(aviso => {
            aviso.remove();
        });
    }, 4000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('inicio') }}">
            Papelería
        </a>

        <div class="dropdown">
            <button
                class="btn btn-outline-light dropdown-toggle"
                type="button"
                id="menuAdministrar"
                data-bs-toggle="dropdown"
                aria-expanded="false">
                Administrar
            </button>

            <ul class="dropdown-menu dropdown-menu-end"
                aria-labelledby="menuAdministrar">
                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('marcas.listar') }}">
                        Marcas
                    </a>
                </li>

                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('productos.listar') }}">
                        Productos
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('presentaciones.listar') }}">
                        Presentaciones
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('clientes.listar') }}">
                        Clientes
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('surtido.listar') }}">
                        Fecha Surtido
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                        href="{{ url_for('inventario.listar') }}">
                        Inventario
                    </a>
                </li>
                <li>
                    <a class="dropdown-item"
                    href="{{ url_for('venta.listar') }}">
                        Ventas
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <main class="container py-4">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="alert alert-{{ categoria }}" role="alert">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
